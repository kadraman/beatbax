name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [v22.x]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build-all

      - name: Bundle validation engine host
        run: npm -w @beatbax/desktop run bundle-validation-host

      - name: Install Linux GUI dependencies for Electron
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-electron-deps.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run package tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Run package tests (Linux)
        if: runner.os == 'Linux'
        env:
          # Jest spawns a throwaway Electron for user-chip plugin shape checks.
          # GitHub Linux runners cannot set chrome-sandbox SUID (4755/root), so the
          # test helper may opt out of Chromium's OS sandbox only when this is set.
          # Production Desktop validation does not use this spawn path.
          # Needs Xvfb/$DISPLAY; ozone headless cannot finish a sandboxed BrowserWindow.
          BEATBAX_ELECTRON_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm test

      - name: Lint (optional)
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [ -f package.json ]; then
            if npm run | grep -q lint; then
              npm run lint --silent || true
            fi
          fi
