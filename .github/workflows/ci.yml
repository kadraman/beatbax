name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [v22.x]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build-all

      - name: Run package tests
        env:
          # Jest spawns a throwaway Electron for user-chip plugin shape checks.
          # GitHub Linux runners cannot set chrome-sandbox SUID (4755/root), so the
          # test helper may opt out of Chromium's OS sandbox only when this is set.
          # Production Desktop validation does not use this spawn path.
          BEATBAX_ELECTRON_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm test

      - name: Lint (optional)
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [ -f package.json ]; then
            if npm run | grep -q lint; then
              npm run lint --silent || true
            fi
          fi
