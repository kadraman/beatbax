name: "Desktop: Build"

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/app-core/**'
      - 'packages/engine/**'
      - 'packages/ui-tokens/**'
      - 'packages/plugins/**'
      - 'songs/**'
      - 'apps/web-ui/public/**'
      - 'apps/web-ui/src/utils/browser-path.ts'
      - 'scripts/link-local-engine.cjs'
      - 'scripts/link-local-plugins.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yaml'
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build platform installers (required to test signing)
        type: boolean
        default: true
      skip_validate:
        description: Skip unit/e2e validate (faster packaging / signing smoke test)
        type: boolean
        default: false

# Cancel superseded development builds on main; never cancel desktop-v* tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  detect:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_dev: ${{ steps.detect.outputs.package_dev }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      desktop_version: ${{ steps.detect.outputs.desktop_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect desktop-related path changes
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node apps/desktop/scripts/detect-desktop-changes.cjs

  validate:
    name: Validate desktop shell
    needs: detect
    # Always on PR/tag; on main only when desktop-related files changed;
    # on manual runs unless skip_validate is checked.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.skip_validate != true)
      && (
        github.event_name != 'push'
        || github.ref != 'refs/heads/main'
        || needs.detect.outputs.package_dev == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build-all

      - name: Run desktop unit tests
        run: npm run desktop:test

      - name: Install Linux GUI dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1

      - name: Run desktop Electron smoke test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm -w @beatbax/desktop run test:e2e

  package:
    name: Package desktop (${{ matrix.os }})
    needs: [validate, detect]
    permissions:
      contents: read
    # Manual "Run workflow" with build_installers, a desktop-v* tag, or a
    # desktop-related push to main. `always()` + validate success/skipped so
    # skip_validate still packages.
    if: >-
      always()
      && !cancelled()
      && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
      && needs.detect.result == 'success'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.build_installers)
        || startsWith(github.ref, 'refs/tags/desktop-v')
        || (
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.detect.outputs.package_dev == 'true'
        )
      )
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      BEATBAX_DEV_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
      BEATBAX_DESKTOP_VERSION: ${{ needs.detect.outputs.desktop_version }}
      BEATBAX_DESKTOP_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'desktop-dev' || '' }}
      BEATBAX_PREVIOUS_DESKTOP_TAG: ${{ needs.detect.outputs.previous_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build-all

      - name: Generate development release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/desktop/scripts/generate-changelog.cjs --notes-only --out apps/desktop/build/release-notes.body.txt

      - name: Setup codesign certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not configured; building unsigned macOS artifacts"
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Build installers
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: npm run desktop:dist

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not configured; skipping macOS signature verification"
            exit 0
          fi
          APP_PATH=$(find apps/desktop/dist -maxdepth 2 -name 'BeatBax.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "BeatBax.app not found; skipping signature verification"
            exit 0
          fi
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vv -t install "$APP_PATH"

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: pwsh
        run: |
          $missing = @(
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TRUSTED_SIGNING_ENDPOINT',
            'AZURE_TRUSTED_SIGNING_ACCOUNT',
            'AZURE_TRUSTED_SIGNING_PROFILE',
            'AZURE_TRUSTED_SIGNING_PUBLISHER'
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            Write-Host "Azure Trusted Signing secrets not fully configured; skipping Authenticode verification"
            exit 0
          }
          $exes = Get-ChildItem -Path "apps/desktop/dist" -Filter "BeatBax-*.exe" -File
          if (-not $exes) {
            throw "No BeatBax-*.exe artifacts found to verify"
          }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): Status=$($sig.Status); Signer=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature not Valid for $($exe.Name): $($sig.Status)"
            }
          }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/BeatBax-*.exe
            apps/desktop/dist/BeatBax-*.dmg
            apps/desktop/dist/BeatBax-*.zip
            apps/desktop/dist/BeatBax-*.AppImage
            apps/desktop/dist/BeatBax-*.deb
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve previous desktop tag
        id: prev
        run: node apps/desktop/scripts/generate-changelog.cjs --print-previous --tag "${{ github.ref_name }}"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts, sign integrity, create SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: bash .github/scripts/flatten-and-sign-desktop-release.sh

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-flat/BeatBax-*.exe
            release-flat/BeatBax-*.dmg
            release-flat/BeatBax-*.zip
            release-flat/BeatBax-*.AppImage
            release-flat/BeatBax-*.deb
            release-flat/SHA256SUMS
            release-flat/SHA256SUMS.asc
            release-flat/beatbax-release.asc
          body_path: apps/desktop/build/release-notes.body.txt
          overwrite_assets: true
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.tag }}
          fail_on_unmatched_files: false

      - name: Prepend GitHub notes to CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          node apps/desktop/scripts/generate-changelog.cjs --prepend --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md unchanged"
            exit 0
          fi
          git commit -m "docs(desktop): changelog for ${TAG} [skip ci]"
          git push origin main

  release-dev:
    name: Publish development release
    needs: [package, detect]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts, sign integrity, create SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: bash .github/scripts/flatten-and-sign-desktop-release.sh

      - name: Delete previous Development pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view desktop-dev >/dev/null 2>&1; then
            gh release delete desktop-dev --yes --cleanup-tag
          else
            echo "No existing desktop-dev release"
          fi

      - name: Publish Development pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-dev
          name: Development
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          previous_tag: ${{ needs.detect.outputs.previous_tag }}
          body: |
            > **Development build** of BeatBax Desktop from `main` (rolling pre-release).
            > This is **not** the latest stable release. Testers should prefer a `desktop-v*` tag for production use.
            >
            > Version: `${{ needs.detect.outputs.desktop_version }}`
            > Commit: `${{ github.sha }}`
            >
            > Windows installers are unsigned; SmartScreen may warn. Verify downloads with `SHA256SUMS`.
            > Keep GitHub Immutable Releases **off** for this repository — this channel deletes and recreates the `desktop-dev` tag each run.
          files: |
            release-flat/BeatBax-*.exe
            release-flat/BeatBax-*.dmg
            release-flat/BeatBax-*.zip
            release-flat/BeatBax-*.AppImage
            release-flat/BeatBax-*.deb
            release-flat/SHA256SUMS
            release-flat/SHA256SUMS.asc
            release-flat/beatbax-release.asc
          fail_on_unmatched_files: false
