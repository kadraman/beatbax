name: "Desktop: Build"

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/app-core/**'
      - 'packages/engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yaml'
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build platform installers (required to test signing)
        type: boolean
        default: true
      skip_validate:
        description: Skip unit/e2e validate (faster packaging / signing smoke test)
        type: boolean
        default: false

jobs:
  validate:
    name: Validate desktop shell
    # Always on PR/push/tag; on manual runs unless skip_validate is checked.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_validate != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build-all

      - name: Run desktop unit tests
        run: npm run desktop:test

      - name: Install Linux GUI dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1

      - name: Run desktop Electron smoke test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm -w @beatbax/desktop run test:e2e

  package:
    name: Package desktop (${{ matrix.os }})
    needs: validate
    permissions:
      contents: read
    # Manual "Run workflow" with build_installers, or a desktop-v* tag.
    # `always()` + validate success/skipped so skip_validate still packages.
    if: >-
      always()
      && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
      && (
        (github.event_name == 'workflow_dispatch' && inputs.build_installers)
        || startsWith(github.ref, 'refs/tags/desktop-v')
      )
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build-all

      - name: Setup codesign certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not configured; building unsigned macOS artifacts"
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Build installers
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARIZE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MAC_NOTARIZE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: npm run desktop:dist

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not configured; skipping macOS signature verification"
            exit 0
          fi
          APP_PATH=$(find apps/desktop/dist -maxdepth 2 -name 'BeatBax.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "BeatBax.app not found; skipping signature verification"
            exit 0
          fi
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vv -t install "$APP_PATH"

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: pwsh
        run: |
          $missing = @(
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TRUSTED_SIGNING_ENDPOINT',
            'AZURE_TRUSTED_SIGNING_ACCOUNT',
            'AZURE_TRUSTED_SIGNING_PROFILE',
            'AZURE_TRUSTED_SIGNING_PUBLISHER'
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            Write-Host "Azure Trusted Signing secrets not fully configured; skipping Authenticode verification"
            exit 0
          }
          $exes = Get-ChildItem -Path "apps/desktop/dist" -Filter "BeatBax-*.exe" -File
          if (-not $exes) {
            throw "No BeatBax-*.exe artifacts found to verify"
          }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): Status=$($sig.Status); Signer=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature not Valid for $($exe.Name): $($sig.Status)"
            }
          }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/BeatBax-*.exe
            apps/desktop/dist/BeatBax-*.dmg
            apps/desktop/dist/BeatBax-*.zip
            apps/desktop/dist/BeatBax-*.AppImage
            apps/desktop/dist/BeatBax-*.deb
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts, sign integrity, create SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p release-flat
          find release-artifacts -type f \( \
            -name 'BeatBax-*.exe' -o \
            -name 'BeatBax-*.dmg' -o \
            -name 'BeatBax-*.zip' -o \
            -name 'BeatBax-*.AppImage' -o \
            -name 'BeatBax-*.deb' \
          \) -exec cp -n {} release-flat/ \;
          cd release-flat

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY not configured; publishing unsigned SHA256SUMS only"
            sha256sum BeatBax-* | tee SHA256SUMS
            exit 0
          fi

          sudo apt-get update
          # dpkg-sig is not packaged on Ubuntu 24.04 (noble). Prefer it when
          # available; otherwise skip embedded .deb signatures and still publish
          # SHA256SUMS + detach signature (primary integrity path).
          DEB_SIGN_TOOL=""
          if sudo apt-get install -y dpkg-sig; then
            DEB_SIGN_TOOL="dpkg-sig"
          else
            echo "Warning: dpkg-sig unavailable on this runner; skipping embedded .deb signatures"
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          PASS_FILE=""
          GPG_OPTS=(--batch --yes --pinentry-mode loopback)
          GPG_OPTS_STR="--batch --yes --pinentry-mode loopback"
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            PASS_FILE="$(mktemp)"
            printf '%s' "$GPG_PASSPHRASE" > "$PASS_FILE"
            chmod 600 "$PASS_FILE"
            GPG_OPTS+=(--passphrase-file "$PASS_FILE")
            GPG_OPTS_STR="$GPG_OPTS_STR --passphrase-file $PASS_FILE"
          fi

          # 1) Sign .deb packages first (changes file hashes).
          shopt -s nullglob
          deb_files=(BeatBax-*.deb)
          if [ ${#deb_files[@]} -gt 0 ] && [ "$DEB_SIGN_TOOL" = "dpkg-sig" ]; then
            for deb in "${deb_files[@]}"; do
              if [ -n "${GPG_KEY_ID:-}" ]; then
                dpkg-sig --sign builder -k "$GPG_KEY_ID" \
                  --gpg-options "$GPG_OPTS_STR" \
                  "$deb"
              else
                dpkg-sig --sign builder \
                  --gpg-options "$GPG_OPTS_STR" \
                  "$deb"
              fi
              echo "Signed $deb with dpkg-sig"
            done
          elif [ ${#deb_files[@]} -gt 0 ]; then
            echo "Skipping embedded .deb signatures (dpkg-sig not installed)"
          else
            echo "No .deb artifacts to sign"
          fi

          # 2) Checksums include signed .deb files.
          sha256sum BeatBax-* | tee SHA256SUMS

          # 3) Detach-sign the checksum file.
          if [ -n "${GPG_KEY_ID:-}" ]; then
            gpg "${GPG_OPTS[@]}" --detach-sign --armor -u "$GPG_KEY_ID" -o SHA256SUMS.asc SHA256SUMS
            gpg --armor --export "$GPG_KEY_ID" > beatbax-release.asc
          else
            gpg "${GPG_OPTS[@]}" --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS
            gpg --armor --export > beatbax-release.asc
          fi
          echo "Wrote SHA256SUMS.asc and beatbax-release.asc"

          if [ -n "$PASS_FILE" ]; then
            rm -f "$PASS_FILE"
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-flat/BeatBax-*.exe
            release-flat/BeatBax-*.dmg
            release-flat/BeatBax-*.zip
            release-flat/BeatBax-*.AppImage
            release-flat/BeatBax-*.deb
            release-flat/SHA256SUMS
            release-flat/SHA256SUMS.asc
            release-flat/beatbax-release.asc
          overwrite_assets: true
          generate_release_notes: true
          fail_on_unmatched_files: false
